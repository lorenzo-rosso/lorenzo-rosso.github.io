name: Build CV PDF

on:
  push:
    branches:
      - main
    paths:
      - 'cv.tex'
      - 'cv-short.tex'
      - '.github/workflows/build-cv.yml'

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # BUILD FULL CV
      # ----------------------------------------------

      - name: Compile full CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex

      # ----------------------------------------------
      # BUILD SHORT CV
      # ----------------------------------------------

      - name: Compile short CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv-short.tex

      # ----------------------------------------------
      # COMMIT GENERATED PDFs
      # ----------------------------------------------

      - name: Commit generated PDFs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cv.pdf cv-short.pdf

          if git diff --cached --quiet; then
            echo "No changes to PDFs"
          else
            git commit -m "Update CV PDFs"
            git push
          fi
